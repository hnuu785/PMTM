services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pmtm
      POSTGRES_USER: pmtm
      POSTGRES_PASSWORD: pmtm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
