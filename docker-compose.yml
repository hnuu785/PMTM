services:
  backend:
    build:
      context: ./pmtm-be
    env_file:
      - path: ./.env
        required: false
      - path: ./.env.local
        required: false
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3100
      DATABASE_URL: postgresql://pmtm:pmtm@postgres:5432/pmtm
      REDIS_URL: redis://redis:6379/0
      QWEN_PYTHON_PATH: /usr/local/bin/python
      QWEN_TIMEOUT_SECONDS: 120
    ports:
      - "8100:8000"
    volumes:
      - ./pmtm-ai:/pmtm-ai
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pmtm
      POSTGRES_USER: pmtm
      POSTGRES_PASSWORD: pmtm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
