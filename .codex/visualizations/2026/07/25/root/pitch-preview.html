<div id="pitch-preview" aria-label="Flow Planner pitch roll">
  <div class="viz-controls">
    <label class="form-label" for="pitch-line">라인
      <select id="pitch-line" class="form-select">
        <option value="0">1 — 오늘도 난 이 도시 위를 달려가</option>
        <option value="1">2 — 조용한 밤을 깨우며 더 높이 올라가</option>
        <option value="2">3 — 어제의 상처까지 리듬 위에 묻어</option>
        <option value="3">4 — 끝까지 나를 믿고 다음 장을 열어</option>
      </select>
    </label>
  </div>
  <svg id="pitch-roll" role="img" aria-label="선택한 라인의 음절별 MIDI 피아노 롤" viewBox="0 0 720 230"></svg>
  <div id="pitch-detail" class="text-small" aria-live="polite"></div>
</div>
<style>
  #pitch-preview { display: grid; gap: 12px; }
  #pitch-roll { width: 100%; height: auto; overflow: visible; }
  #pitch-roll .grid { stroke: var(--border); stroke-width: 1; }
  #pitch-roll .axis { fill: var(--muted-foreground); font-size: 12px; }
  #pitch-roll .note { fill: var(--viz-series-1); fill-opacity: .8; }
  #pitch-roll .ending { fill: var(--viz-series-2); fill-opacity: .85; }
  #pitch-roll .label { fill: var(--foreground); font-size: 13px; text-anchor: middle; }
</style>
<script>
(() => {
  const root = document.getElementById('pitch-preview');
  const select = root.querySelector('#pitch-line');
  const svg = root.querySelector('#pitch-roll');
  const detail = root.querySelector('#pitch-detail');
  const lines = [[['오',16.1974,16.4474,62],['늘',16.4474,16.5724,60],['도',16.5724,16.6974,60],['난',16.6974,16.8224,62],['이',16.8224,16.9474,60],['도',16.9474,17.1974,62],['시',17.1974,17.3224,60],['위',17.3224,17.4474,62],['를',17.4474,17.5724,60],['달',17.5724,17.6974,62],['려',17.6974,17.8224,60],['가',17.8224,18.0724,58]],[['조',18.1974,18.3224,62],['용',18.3224,18.4474,60],['한',18.4474,18.5724,60],['밤',18.5724,18.6974,62],['을',18.6974,18.8224,60],['깨',18.8224,18.9474,62],['우',18.9474,19.0724,60],['며',19.0724,19.1974,60],['더',19.1974,19.4474,62],['높',19.4474,19.5724,62],['이',19.5724,19.6974,60],['올',19.6974,19.8224,62],['라',19.8224,19.9474,60],['가',19.9474,20.1974,58]],[['어',20.1974,20.4474,62],['제',20.4474,20.5724,60],['의',20.5724,20.6974,60],['상',20.6974,20.8224,62],['처',20.8224,20.9474,60],['까',20.9474,21.0724,60],['지',21.0724,21.1974,60],['리',21.1974,21.4474,62],['듬',21.4474,21.5724,60],['위',21.5724,21.8224,62],['에',21.8224,21.9474,60],['묻',21.9474,22.0724,62],['어',22.0724,22.1974,58]],[['끝',22.1974,22.4474,62],['까',22.4474,22.5724,60],['지',22.5724,22.6974,60],['나',22.6974,22.8224,62],['를',22.8224,22.9474,60],['믿',22.9474,23.0724,62],['고',23.0724,23.1974,60],['다',23.1974,23.4474,62],['음',23.4474,23.5724,60],['장',23.5724,23.8224,62],['을',23.8224,23.9474,60],['열',23.9474,24.0724,62],['어',24.0724,24.1974,58]]];
  const render = () => {
    const notes = lines[Number(select.value)];
    const start = notes[0][1]; const end = notes.at(-1)[2]; const width = 640; const left = 55; const top = 24; const row = 46;
    const x = value => left + ((value - start) / (end - start)) * width;
    const y = midi => top + (62 - midi) * row;
    const grid = [62,60,58].map(midi => `<line class="grid" x1="${left}" x2="${left + width}" y1="${y(midi)+18}" y2="${y(midi)+18}"/><text class="axis" x="8" y="${y(midi)+22}">MIDI ${midi}</text>`).join('');
    const rects = notes.map(([text,from,to,midi]) => `<rect class="${midi === 58 ? 'ending' : 'note'}" x="${x(from)}" y="${y(midi)}" width="${Math.max(3,x(to)-x(from))}" height="36" rx="3"><title>${text}: MIDI ${midi}, ${(to-from).toFixed(3)} sec</title></rect><text class="label" x="${(x(from)+x(to))/2}" y="${y(midi)+23}">${text}</text>`).join('');
    svg.innerHTML = `<title>음절별 MIDI 피아노 롤</title><desc>62는 내용어 accent, 60은 기본 pitch, 58은 라인 끝맺기입니다.</desc>${grid}${rects}`;
    detail.textContent = `음절 ${notes.length}개 · MIDI 62 accent / 60 기본 / 58 종결`;
  };
  select.addEventListener('change', render);
  render();
})();
</script>
